[package]
name = "hashu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `hashu` command: run a Hashu hashrate mint and Stratum proxy, buy and redeem terahash-hours"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords.workspace = true
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

# The package is published as `hashu` (so `cargo install hashu` works); the
# library keeps its old name so code paths like `hashu_cli::mint` stay put.
[lib]
name = "hashu_cli"
path = "src/lib.rs"

[[bin]]
name = "hashu"
path = "src/main.rs"

[dependencies]
hashu-core = { workspace = true }
hashu-mint = { workspace = true }
hashu-proxy = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
dialoguer = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bitcoin = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
cdk = { version = "0.16", default-features = false, features = ["mint", "wallet"] }
cdk-axum = "0.16"
cdk-sqlite = "0.16"
axum = "0.8.9"
cdk-fake-wallet = "0.16"
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
crc32fast = "1"

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
