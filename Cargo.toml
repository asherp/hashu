[workspace]
resolver = "2"
members = [
    "hashu-core",
    "hashu-mint",
    "hashu-proxy",
    "hashu-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://hashu.io"
repository = "https://github.com/asherp/hashu"
readme = "README.md"
keywords = ["bitcoin", "cashu", "ecash", "mining", "stratum"]
authors = ["Hashu contributors"]

[workspace.dependencies]
# Internal crates: `version` is what crates.io records, `path` is used in the workspace.
hashu-core = { path = "hashu-core", version = "0.1.0" }
hashu-mint = { path = "hashu-mint", version = "0.1.0" }
hashu-proxy = { path = "hashu-proxy", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
time = { version = "0.3", default-features = false, features = ["parsing", "formatting", "std", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
nostr = "0.44"
nostr-sdk = { version = "0.44", default-features = false, features = ["all-nips"] }
dialoguer = "0.11"
tempfile = "3"
bitcoin = { version = "0.32", default-features = false, features = ["std", "rand-std", "secp-recovery"] }
