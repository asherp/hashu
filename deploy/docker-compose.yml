# A Hashu mint on one internet-facing machine. Everything deployment
# specific comes from .env; the required variables have no defaults, and
# `docker compose up` stops with the name of any that is missing. See
# deploy/README.md ("Configuration") for the list.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build        # build from this checkout, or
#   docker compose pull && docker compose up -d   # use the images CI publishes
#                                                 # (.github/workflows/images.yml)
#
# What is reachable from the internet:
#   80/443  Caddy (TLS)  -> mint API (hashu:8085) at https://$HASHU_DOMAIN/
#                        -> operator GUI (hashu:3334) at /operator/ (basic auth)
#                        -> GET /control/status (read-only, for the MDK app)
#                        -> slide deck at /slides/ (built into the caddy image)
#                        also answers for $HASHU_EXTRA_DOMAINS (optional)
#                        -> /mdk redirects to the MDK dashboard demo at
#                           https://$HASHU_MDK_DOMAIN/ (optional, profile "mdk")
#   $HASHU_STRATUM_PORT (3335)  Stratum proxy, raw TCP, straight to the
#                        hashu container
# Private (compose network only, never published on the host):
#   hashu:3334  control API + operator GUI (POST api/controls changes pricing)
#   phoenixd:9740  phoenixd HTTP API (mainnet wallet)
# See deploy/README.md for the runbook.

name: hashu

services:
  phoenixd:
    build:
      context: ./phoenixd
      args:
        PHOENIXD_VERSION: ${PHOENIXD_VERSION:-0.9.1}
    image: ${HASHU_REGISTRY:-ghcr.io/asherp}/hashu-phoenixd:${HASHU_IMAGE_TAG:-latest}
    environment:
      PHOENIXD_PASSWORD: ${PHOENIXD_PASSWORD:?set PHOENIXD_PASSWORD in .env}
      PHOENIXD_LIMITED_PASSWORD: ${PHOENIXD_LIMITED_PASSWORD:?set PHOENIXD_LIMITED_PASSWORD in .env}
      # Optional: restore an existing wallet on FIRST boot only.
      PHOENIXD_SEED: ${PHOENIXD_SEED:-}
      PHOENIXD_EXTRA_ARGS: ${PHOENIXD_EXTRA_ARGS:-}
    volumes:
      # Mount AT the datadir (the image declares an anonymous volume there).
      # seed.dat lives here: back it up.
      - phoenixd_data:/phoenix/.phoenix
    # No `ports:` on purpose. Only hashu reaches it, over the compose network.
    networks: [backend]
    restart: unless-stopped

  hashu:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${HASHU_REGISTRY:-ghcr.io/asherp}/hashu:${HASHU_IMAGE_TAG:-latest}
    depends_on: [phoenixd]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HASHU_DATA_DIR: /data
      HASHU_MINT_URL: https://${HASHU_DOMAIN:?set HASHU_DOMAIN in .env}
      HASHU_UPSTREAM: ${HASHU_UPSTREAM:?set HASHU_UPSTREAM in .env (the pool miners mine to when no redemption is open)}
      # NUT-06 identity shown in wallets and on the landing page.
      HASHU_MINT_NAME: ${HASHU_MINT_NAME:-}
      HASHU_MINT_DESCRIPTION: ${HASHU_MINT_DESCRIPTION:-}
      HASHU_MINT_CONTACT: ${HASHU_MINT_CONTACT:-}
      # Home pools for Bitaxes and other small miners on port 3335: a miner
      # whose user is a bc1/1/3 address idles on this solo pool (its own
      # address), or on `pool=host:port` from its password if that host is
      # in HASHU_HOME_POOLS. See docs/mine/bitaxe.md. HASHU_HOME_POOLS_OFF=true
      # sends every miner to HASHU_UPSTREAM as before.
      HASHU_HOME_SOLO_UPSTREAM: ${HASHU_HOME_SOLO_UPSTREAM:-solo.ckpool.org:3333}
      HASHU_HOME_POOLS: ${HASHU_HOME_POOLS:-solo.ckpool.org,eusolo.ckpool.org,ausolo.ckpool.org,public-pool.io,stratum.braiins.com,mine.ocean.xyz}
      HASHU_HOME_POOLS_OFF: ${HASHU_HOME_POOLS_OFF:-false}
      # The operator's own rigs: your pool user (e.g. rented rigs mine as
      # <user>.<rig>). Set it and only those rigs fill this mint's orders;
      # other miners stay on their home pool, and account-name users with no
      # home pool are refused. Unset: any rig may be borrowed.
      HASHU_OPERATOR_WORKER: ${HASHU_OPERATOR_WORKER:-}
      # Registered suppliers, a JSON file in the data volume, e.g.
      # /data/suppliers.json. Each gets a mint at <name>.$HASHU_DOMAIN
      # (wildcard DNS record) filled only by its own rigs. Unset: none.
      HASHU_SUPPLIERS_FILE: ${HASHU_SUPPLIERS_FILE:-}
      # Fallback price while the live (MRR) source has no fresh sample.
      HASHU_SATS_PER_THH: ${HASHU_SATS_PER_THH:-40}
      # Lightning: mainnet phoenixd, limited-access password (can create
      # invoices and read payments, cannot send).
      PHOENIXD_URL: http://phoenixd:9740
      PHOENIXD_PASSWORD: ${PHOENIXD_LIMITED_PASSWORD}
      PHOENIXD_CHAIN: ${PHOENIXD_CHAIN:-mainnet}
      # Stablecoins, mainnet (real funds). USDT (Ethereum by default) is on
      # when HASHU_USDT_DEPOSIT is set, USDC (Base by default) when
      # HASHU_USDC_DEPOSIT is set. Each coin's chain is configurable.
      HASHU_USDT_DEPOSIT: ${HASHU_USDT_DEPOSIT:-}
      HASHU_USDT_TOKEN: ${HASHU_USDT_TOKEN:-0xdAC17F958D2ee523a2206206994597C13D831ec7}
      HASHU_USDT_RPC: ${HASHU_USDT_RPC:-https://ethereum-rpc.publicnode.com}
      HASHU_USDT_CHAIN_ID: ${HASHU_USDT_CHAIN_ID:-1}
      HASHU_USDT_CONFIRMATIONS: ${HASHU_USDT_CONFIRMATIONS:-12}
      HASHU_USDC_DEPOSIT: ${HASHU_USDC_DEPOSIT:-}
      HASHU_USDC_TOKEN: ${HASHU_USDC_TOKEN:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
      HASHU_USDC_RPC: ${HASHU_USDC_RPC:-https://base-rpc.publicnode.com}
      HASHU_USDC_CHAIN_ID: ${HASHU_USDC_CHAIN_ID:-8453}
      HASHU_USDC_CONFIRMATIONS: ${HASHU_USDC_CONFIRMATIONS:-30}
      HASHU_USD_PER_BTC: ${HASHU_USD_PER_BTC:-}
      HASHU_USDT_PER_THH: ${HASHU_USDT_PER_THH:-}
      # Capacity from MRR active rentals (optional; see .env.example).
      MRR_API_KEY: ${MRR_API_KEY:-}
      MRR_API_SECRET: ${MRR_API_SECRET:-}
      HASHU_MRR_RENTAL_IDS: ${HASHU_MRR_RENTAL_IDS:-}
      # Heat estimate: J/TH for rigs whose name does not name a model.
      HASHU_HEAT_J_PER_TH: ${HASHU_HEAT_J_PER_TH:-30}
    command:
      - mint
      - run
      - --listen=0.0.0.0:8085
      - --stratum-bind=0.0.0.0:3333
      # Reachable by Caddy on the compose network, NOT published on the host.
      # Never add --control-allow-open here.
      - --control-bind=0.0.0.0:3334
      - --lightning=${HASHU_LIGHTNING:-phoenixd}
      - --price=${HASHU_PRICE:-mrr}
      # Chain for --price esplora (mainnet hashprice by default).
      - --network=${HASHU_NETWORK:-bitcoin}
    volumes:
      - hashu_data:/data
    ports:
      # Miners connect straight to the Stratum proxy (raw TCP, no TLS).
      # Host port 3335 by default (set HASHU_STRATUM_PORT=3333 if it is free).
      - "${HASHU_STRATUM_PORT:-3335}:3333"
    networks: [backend, edge]
    restart: unless-stopped

  # MDK demo (Hashrate at Home): the Hashu Heater app and a mock heater in
  # the MDK stack, with the MDK dashboard. All mock: it uses its own demo
  # mint (mdk-hashu) and fake pools, never the live mint or a real pool.
  # Off unless COMPOSE_PROFILES=mdk; it also needs HASHU_MDK_DOMAIN,
  # MDK_DEMO_USER and MDK_DEMO_PASSWORD.
  mdk:
    profiles: [mdk]
    build:
      context: ..
      dockerfile: deploy/mdk/Dockerfile
    image: ${HASHU_REGISTRY:-ghcr.io/asherp}/hashu-mdk:${HASHU_IMAGE_TAG:-latest}
    environment:
      MDK_DEMO_USER: ${MDK_DEMO_USER:-}
      MDK_DEMO_PASSWORD: ${MDK_DEMO_PASSWORD:-}
    networks: [mdk, edge]
    restart: unless-stopped

  # The demo's own Hashu mint + proxy: fake Lightning, fixed price, upstream
  # is the fake home pool. POST /redemptions is on so the dashboard's Redeem
  # button works; it is reachable only from the mdk network.
  mdk-hashu:
    profiles: [mdk]
    # Same image as `hashu` (built or pulled by that service).
    image: ${HASHU_REGISTRY:-ghcr.io/asherp}/hashu:${HASHU_IMAGE_TAG:-latest}
    depends_on: [hashu]
    command:
      - mint
      - run
      - --listen=0.0.0.0:8085
      - --data-dir=/tmp/mdk-demo-mint
      - --lightning=fake
      - --price=fixed
      - --sats-per-thh=40
      - --stratum-bind=0.0.0.0:3333
      - --upstream=mdk:3340
      - --control-bind=0.0.0.0:3334
      - --control-allow-open
    networks: [mdk]
    restart: unless-stopped

  caddy:
    # caddy:2 plus deploy/Caddyfile and the Slidev deck (slides/) built at
    # /srv/slides. The Caddyfile is baked in (not bind-mounted), so routes
    # always match the image. To test a local Caddyfile edit without a
    # rebuild, add `- ./Caddyfile:/etc/caddy/Caddyfile:ro` under volumes in a
    # docker-compose.override.yml, then remove it again.
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    image: ${HASHU_REGISTRY:-ghcr.io/asherp}/hashu-caddy:${HASHU_IMAGE_TAG:-latest}
    depends_on: [hashu]
    environment:
      HASHU_DOMAIN: ${HASHU_DOMAIN:?set HASHU_DOMAIN in .env}
      # MDK dashboard demo host (optional; needs to resolve here, an
      # <ip-with-dashes>.sslip.io name works as-is). Unset: no /mdk.
      HASHU_MDK_DOMAIN: ${HASHU_MDK_DOMAIN:-}
      # Extra names that serve the same site with the splash page at /
      # (optional, space separated; needs A records on this machine).
      HASHU_EXTRA_DOMAINS: ${HASHU_EXTRA_DOMAINS:-}
      OPERATOR_USER: ${OPERATOR_USER:-operator}
      OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:?set OPERATOR_PASSWORD_HASH in .env (caddy hash-password)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    restart: unless-stopped

networks:
  backend: {}
  edge: {}
  mdk: {}

volumes:
  phoenixd_data: {}
  hashu_data: {}
  caddy_data: {}
  caddy_config: {}
