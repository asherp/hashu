[package]
name = "hashu-mint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cashu mint (built on CDK) that issues and redeems ecash denominated in terahash-hours"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords.workspace = true
categories = ["cryptography::cryptocurrencies"]

[dependencies]
hashu-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
time = { workspace = true }
nostr = { workspace = true }
nostr-sdk = { workspace = true }
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
anyhow = { workspace = true }
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
# `mint` feature pulls in cdk-signatory, which has a build script that
# invokes `protoc`. Make sure `protoc` is on PATH or `PROTOC` is set.
cdk = { version = "0.16", features = ["mint", "wallet", "nostr"] }

[dev-dependencies]
cdk-sqlite = "0.16"
cdk-fake-wallet = "0.16"
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
