[package]
name = "hashu-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stratum V1 (plain TCP or TLS upstream) hashrate proxy for Hashu that credits shares and redirects hashrate to a redeemer's pool"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords.workspace = true
categories = ["cryptography::cryptocurrencies", "network-programming"]

[dependencies]
hashu-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }
