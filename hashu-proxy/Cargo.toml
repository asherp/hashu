[package]
name = "hashu-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stratum V1 (plain TCP, TLS or Stratum V2 upstream) hashrate proxy for Hashu that credits shares and redirects hashrate to a redeemer's pool"
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords.workspace = true
categories = ["cryptography::cryptocurrencies", "network-programming"]

[dependencies]
hashu-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# Stratum V2 upstream (see src/sv2.rs). SRI's crate APIs churn, so pin exactly.
stratum-core = { version = "=0.7.0", features = ["translation"] }
stratum-apps = { version = "=0.9.0", default-features = false, features = ["network"] }

[dev-dependencies]
tempfile = { workspace = true }
# Same version as stratum-apps' key_utils, for the mock SV2 pool's keys.
secp256k1 = "=0.28.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }
