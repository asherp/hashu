# Builds the live-demo images and publishes them to GHCR, so a server can
# `docker compose pull` instead of compiling (see deploy/DIGITALOCEAN.md).
#
#   ghcr.io/asherp/hashu           mint + payment rails + Stratum proxy
#   ghcr.io/asherp/hashu-caddy     Caddy with the slides, splash site, redeem guides and the
#                                  hashu.me wallet (asherp/hashu.me main) baked in
#   ghcr.io/asherp/hashu-mdk       MDK dashboard demo
#   ghcr.io/asherp/hashu-phoenixd  phoenixd with the seed-import entrypoint
#
# Pushes to main publish :latest and :sha-<short>. Pull requests only build
# (nothing is pushed), as a check that the images still build.
#
# A merge in asherp/hashu.me doesn't trigger this: run the workflow by hand
# (Actions > images > Run workflow) to ship a new wallet build.

name: images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.lock
      - "**/Cargo.toml"
      - "hashu-*/**"
      - deploy/**
      - mdk/**
      - slides/**
      - site/**
      - docs/redeem/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hashu
            context: .
            file: Dockerfile
          - name: hashu-caddy
            context: .
            file: deploy/caddy/Dockerfile
          - name: hashu-mdk
            context: .
            file: deploy/mdk/Dockerfile
          - name: hashu-phoenixd
            context: deploy/phoenixd
            file: deploy/phoenixd/Dockerfile
            # Rebuilt only when deploy/phoenixd changes. Every rebuild is a
            # new image (fresh labels and timestamps), so `compose pull`
            # would recreate phoenixd on every deploy: Lightning goes
            # down, and hashu (and with it every miner's connection)
            # waits for phoenixd to be healthy again.
            only_if_changed: deploy/phoenixd
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The wallet's current commit, so the caddy image's wallet layer is
      # rebuilt exactly when asherp/hashu.me main moves.
      - name: Resolve hashu.me commit
        id: app
        run: echo "ref=$(git ls-remote https://github.com/asherp/hashu.me.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images with `only_if_changed`: tag each build with the git tree
      # hash of its directory. When that tag is already published the
      # image is unchanged, so skip the build and point this commit's
      # sha- tag at the existing image (`latest` already is).
      - name: Check for an unchanged image
        id: tree
        if: matrix.only_if_changed
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          DIR: ${{ matrix.only_if_changed }}
        run: |
          tree=$(git rev-parse "HEAD:$DIR")
          echo "tag=tree-$tree" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:tree-$tree" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:tree-$tree is already published; not rebuilding"
          fi

      - name: Tag the unchanged image with this commit
        if: steps.tree.outputs.skip == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          TREE_TAG: ${{ steps.tree.outputs.tag }}
        run: docker buildx imagetools create -t "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:$TREE_TAG"

      - id: meta
        if: steps.tree.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=${{ steps.tree.outputs.tag }},enable=${{ steps.tree.outputs.tag != '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        if: steps.tree.outputs.skip != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            HASHU_APP_REF=${{ steps.app.outputs.ref || 'main' }}
