# Builds the live-demo images and publishes them to GHCR, so a server can
# `docker compose pull` instead of compiling (see deploy/DIGITALOCEAN.md).
#
#   ghcr.io/asherp/hashu           mint + payment rails + Stratum proxy
#   ghcr.io/asherp/hashu-caddy     Caddy with the slides and splash site baked in
#   ghcr.io/asherp/hashu-mdk       MDK dashboard demo
#   ghcr.io/asherp/hashu-phoenixd  phoenixd with the seed-import entrypoint
#
# Pushes to main publish :latest and :sha-<short>. Pull requests only build
# (nothing is pushed), as a check that the images still build.

name: images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.lock
      - "**/Cargo.toml"
      - "hashu-*/**"
      - deploy/**
      - mdk/**
      - slides/**
      - site/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hashu
            context: .
            file: Dockerfile
          - name: hashu-caddy
            context: .
            file: deploy/caddy/Dockerfile
          - name: hashu-mdk
            context: .
            file: deploy/mdk/Dockerfile
          - name: hashu-phoenixd
            context: deploy/phoenixd
            file: deploy/phoenixd/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
